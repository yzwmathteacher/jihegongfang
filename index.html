<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>几何工坊 · 中小学图形可视化教具</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#EEF2F7;
  --card:#FFFFFF;
  --ink:#17293D;
  --ink2:#546B80;
  --ink3:#8DA2B4;
  --line:#D9E3EC;
  --line2:#EDF3F8;
  --red:#D8462E;
  --red-soft:#FBE8E4;
  --teal:#2A7280;
  --gold:#E9A93A;
  --gold-soft:#FCF0D9;
  --shadow:0 1px 2px rgba(23,41,61,.05), 0 8px 24px rgba(23,41,61,.06);
  --serif:"Noto Serif SC","Songti SC",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  text-wrap:pretty;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:22px;margin:0;cursor:pointer;}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--red) var(--fill,0%),#DCE5ED var(--fill,0%));}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--red);margin-top:-6px;box-shadow:0 1px 3px rgba(23,41,61,.18);}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#DCE5ED;}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--red);}

/* ===== 外壳 ===== */
.app{
  display:grid;
  grid-template-columns:248px minmax(0,1fr) 316px;
  grid-template-rows:64px minmax(0,1fr);
  min-height:100vh;
}
.topbar{
  grid-column:1/-1;
  display:flex;align-items:center;justify-content:space-between;
  gap:18px;
  padding:0 22px;
  background:var(--card);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.brand svg{width:34px;height:34px;flex:none;}
.brand h1{
  margin:0;font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:.06em;
}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--ink3);letter-spacing:.02em;}
.stage-switch{display:flex;gap:4px;padding:4px;background:var(--paper);border-radius:9px;flex:none;}
.stage-switch button{
  padding:7px 16px;border-radius:6px;font-size:13px;color:var(--ink2);
  font-weight:500;transition:background .18s,color .18s;
}
.stage-switch button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(23,41,61,.09);}

/* ===== 左栏 ===== */
.rail{
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
  background:transparent;
}
.rail-scroll{overflow-y:auto;padding:16px 12px 24px;flex:1;min-height:0;}
.grp{margin-bottom:18px;}
.grp-title{
  display:flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:.14em;color:var(--ink3);
  padding:0 8px 7px;
}
.grp-title::after{content:"";flex:1;height:1px;background:var(--line);}
.t-item{
  display:flex;align-items:baseline;gap:9px;width:100%;
  padding:8px 9px;border-radius:7px;text-align:left;
  font-size:13.5px;color:var(--ink2);line-height:1.35;
  transition:background .16s,color .16s;
}
.t-item .idx{font-family:var(--mono);font-size:11px;color:var(--ink3);flex:none;width:18px;}
.t-item:hover{background:rgba(255,255,255,.72);color:var(--ink);}
.t-item[aria-current="true"]{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(23,41,61,.06);}
.t-item[aria-current="true"] .idx{color:var(--red);}
.rail-foot{
  padding:12px 16px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink3);line-height:1.6;
}

/* ===== 主区 ===== */
.stage{padding:20px 22px 26px;min-width:0;display:flex;flex-direction:column;gap:14px;}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden;
}
.canvas-card{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;}
.canvas-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:15px 18px 10px;flex:none;}
.canvas-head h2{
  margin:0;font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.02em;line-height:1.3;
}
.canvas-head p{margin:5px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.5;max-width:52ch;}
.badge{
  flex:none;font-size:11px;letter-spacing:.08em;color:var(--teal);
  background:var(--teal-soft,#E4EFF1);border-radius:5px;padding:5px 9px;font-weight:500;
}
.svg-wrap{position:relative;padding:0;background:#FBFCFD;flex:1 1 auto;min-height:180px;overflow:hidden;}
svg#board{position:absolute;top:0;left:10px;width:calc(100% - 20px);height:100%;display:block;}
.toolbar{
  display:flex;align-items:center;gap:14px;padding:10px 18px 13px;flex:none;
  border-top:1px solid var(--line2);
}
.play-btn{
  width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;
  display:grid;place-items:center;flex:none;
  transition:transform .15s,background .15s;
}
.play-btn:hover{background:#C13A24;transform:scale(1.04);}
.play-btn svg{width:14px;height:14px;}
.ghost-btn{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  font-size:12px;color:var(--ink2);padding:6px 10px;border-radius:6px;
  border:1px solid var(--line);
}
.ghost-btn:hover{color:var(--ink);border-color:var(--ink3);}
.track-wrap{flex:1;display:flex;align-items:center;gap:10px;min-width:0;}
input[type=range].track{height:18px;}
input[type=range].track::-webkit-slider-runnable-track{height:3px;background:#E2E9F0;}
input[type=range].track::-webkit-slider-thumb{width:11px;height:11px;margin-top:-4px;border-width:1.5px;}
.time-label{font-family:var(--mono);font-size:11px;color:var(--ink3);flex:none;width:52px;text-align:right;}

/* ===== 右栏 ===== */
.panel{border-left:1px solid var(--line);background:var(--card);overflow-y:auto;min-height:0;}
.panel-block{padding:18px 20px;border-bottom:1px solid var(--line2);}
.panel-block h3{
  margin:0 0 14px;font-size:11px;letter-spacing:.14em;color:var(--ink3);font-weight:500;
  display:flex;align-items:center;gap:8px;
}
.panel-block h3::after{content:"";flex:1;height:1px;background:var(--line2);}
.p-row{margin-bottom:15px;}
.p-row:last-child{margin-bottom:0;}
.p-row .p-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
.p-row .p-name{font-size:12.5px;color:var(--ink2);}
.p-row .p-val{
  font-family:var(--mono);font-size:12.5px;color:var(--ink);
  background:var(--line2);padding:1px 7px;border-radius:4px;
}
.formula{
  font-family:var(--mono);font-size:16px;color:var(--ink);line-height:1.8;
  letter-spacing:.01em;
}
.formula .hl{color:var(--red);font-weight:600;}
.result-line{
  margin-top:10px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;
  font-family:var(--mono);font-size:13px;color:var(--ink2);
}
.result-line b{font-family:var(--mono);font-size:21px;color:var(--red);font-weight:600;}
.steps{display:flex;flex-direction:column;gap:11px;}
.step{
  display:flex;gap:9px;font-size:12.5px;line-height:1.62;color:var(--ink2);
  transition:color .2s;
}
.step .n{
  flex:none;width:17px;height:17px;border-radius:50%;background:var(--line2);
  color:var(--ink3);font-family:var(--mono);font-size:10.5px;
  display:grid;place-items:center;margin-top:1px;transition:background .2s,color .2s;
}
.step.on{color:var(--ink);}
.step.on .n{background:var(--red);color:#fff;}
.tip{
  margin-top:12px;padding:11px 13px;border-radius:8px;background:var(--gold-soft);
  font-size:12.5px;line-height:1.65;color:#7A5716;
}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);}
.lg i{width:10px;height:10px;border-radius:2px;display:block;}

/* ===== 证明题 ===== */
.proof-head{padding:16px 18px 4px;}
.proof-head h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;}
.proof-head p{margin:4px 0 0;font-size:12px;color:var(--ink2);line-height:1.5;}
.proof-body{padding:10px 18px 13px;display:flex;flex-direction:column;gap:8px;}
textarea#probText{
  width:100%;min-height:62px;max-height:120px;resize:vertical;padding:9px 12px;
  border:1px solid var(--line);border-radius:9px;background:#FBFCFD;
  font-family:var(--sans);font-size:13px;line-height:1.7;color:var(--ink);
  outline:none;transition:border-color .18s;
}
textarea#probText:focus{border-color:var(--teal);background:#fff;}
.proof-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.primary-btn{
  padding:9px 18px;border-radius:7px;background:var(--ink);color:#fff;
  font-size:13px;font-weight:500;transition:background .16s;
}
.primary-btn:hover{background:#25405C;}
.chip{
  padding:6px 11px;border-radius:6px;border:1px solid var(--line);
  font-size:12px;color:var(--ink2);background:#fff;
  transition:border-color .16s,color .16s;
}
.chip:hover{border-color:var(--teal);color:var(--teal);}
.hint-line{font-size:11.5px;color:var(--ink3);line-height:1.5;}
.step-nav{display:flex;gap:8px;margin-top:14px;}
.err-box{
  padding:11px 13px;border-radius:8px;background:var(--red-soft);
  font-size:12.5px;line-height:1.65;color:#8E2F1E;
}

/* ===== 移动端 ===== */
@media (max-width:1080px){
  .app{grid-template-columns:200px minmax(0,1fr) 290px;}
  .stage{padding:16px;}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;}
  .topbar{flex-direction:column;align-items:flex-start;gap:10px;padding:14px 16px;}
  .rail{border-right:none;border-bottom:1px solid var(--line);}
  .rail-scroll{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;flex:none;}
  .grp{margin:0;display:flex;gap:8px;align-items:center;}
  .grp-title{display:none;}
  .t-item{width:auto;flex:none;padding:7px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;font-size:12.5px;}
  .t-item .idx{display:none;}
  .rail-foot{display:none;}
  .stage{padding:14px;}
  .panel{border-left:none;border-top:1px solid var(--line);}
  .canvas-head{padding:12px 14px 8px;}
  .canvas-head h2{font-size:17px;}
  .svg-wrap{padding:0;flex:none;min-height:0;aspect-ratio:900/560;}
  svg#board{left:4px;width:calc(100% - 8px);}
  .toolbar{padding:8px 12px 11px;gap:10px;}
  .time-label{width:44px;}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.001ms !important;animation-duration:.001ms !important;}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M4 28 L28 28" stroke="#17293D" stroke-width="1.6"/>
        <path d="M4 28 L4 6" stroke="#17293D" stroke-width="1.6"/>
        <path d="M4 28 L26 7" stroke="#17293D" stroke-width="1.6"/>
        <path d="M4 28 L11 28 L11 24 Z" fill="#D8462E" opacity=".9"/>
        <path d="M8 22 L8 28" stroke="#17293D" stroke-width="1"/>
      </svg>
      <div>
        <h1>几何工坊</h1>
        <p>想不明白的图形，动手做一遍</p>
      </div>
    </div>
    <nav class="stage-switch" id="stageSwitch" role="tablist">
      <button data-stage="primary" role="tab" aria-selected="true">小学</button>
      <button data-stage="middle" role="tab" aria-selected="false">初中</button>
      <button data-stage="proof" role="tab" aria-selected="false">证明题</button>
    </nav>
  </header>

  <aside class="rail">
    <div class="rail-scroll" id="topicList"></div>
    <div class="rail-foot">参数在右侧调节，图形与数据实时联动。<br>拖动进度条可停在任意一步讲解。</div>
  </aside>

  <main class="stage" id="stageMain"></main>
  <aside class="panel" id="sidePanel"></aside>
</div>

<script>
/* ============================================================
   1. 基础工具
   ============================================================ */
const CW = 900, CH = 560;
const COL = {
  ink:'#17293D', ink2:'#5B7186', ink3:'#9AAEBD', line:'#D9E3EC',
  red:'#D8462E', teal:'#2A7280', gold:'#E9A93A',
  redSoft:'#F7D9D1', tealSoft:'#D6E7EA', goldSoft:'#FBE7C2',
  grid:'#E9EFF5', gridBold:'#DFE8F0'
};
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.prototype.slice.call((r||document).querySelectorAll(s));

function r2(n){ return Math.round(n*100)/100; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function seg(t,a,b){ return clamp((t-a)/(b-a),0,1); }
function ease(x){ return x<0.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2; }
function lerp(a,b,t){ return a+(b-a)*t; }
function near(v,target){
  while(v-target>Math.PI) v-=Math.PI*2;
  while(target-v>Math.PI) v+=Math.PI*2;
  return v;
}
function num(v,d){
  d = d==null?2:d;
  const n = Math.round(v*Math.pow(10,d))/Math.pow(10,d);
  return String(n);
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ============================================================
   2. 绘图基元（全部返回 SVG 字符串）
   ============================================================ */
function pt(x,y){ return [r2(x),r2(y)]; }

function line(x1,y1,x2,y2,o){
  o=o||{};
  return `<line x1="${r2(x1)}" y1="${r2(y1)}" x2="${r2(x2)}" y2="${r2(y2)}" stroke="${o.stroke||COL.ink}" stroke-width="${o.sw||1.6}"${o.dash?` stroke-dasharray="${o.dash}"`:''}${o.op!=null?` opacity="${o.op}"`:''} stroke-linecap="${o.cap||'butt'}"/>`;
}

function poly(pts,o){
  o=o||{};
  const d = pts.map(p=>`${r2(p[0])},${r2(p[1])}`).join(' ');
  return `<polygon points="${d}" fill="${o.fill||'none'}" stroke="${o.stroke||'none'}" stroke-width="${o.sw||1.6}"${o.dash?` stroke-dasharray="${o.dash}"`:''}${o.op!=null?` opacity="${o.op}"`:''} stroke-linejoin="miter"/>`;
}

function pathEl(d,o){
  o=o||{};
  return `<path d="${d}" fill="${o.fill||'none'}" stroke="${o.stroke||COL.ink}" stroke-width="${o.sw||1.6}"${o.dash?` stroke-dasharray="${o.dash}"`:''}${o.op!=null?` opacity="${o.op}"`:''} stroke-linecap="${o.cap||'butt'}" stroke-linejoin="round"/>`;
}

function dot(x,y,r,o){
  o=o||{};
  return `<circle cx="${r2(x)}" cy="${r2(y)}" r="${o.r||r||3}" fill="${o.fill||COL.ink}" stroke="${o.stroke||'none'}" stroke-width="${o.sw||0}"/>`;
}

function ring(x,y,r,o){
  o=o||{};
  return `<circle cx="${r2(x)}" cy="${r2(y)}" r="${r2(r)}" fill="${o.fill||'none'}" stroke="${o.stroke||COL.ink}" stroke-width="${o.sw||1.6}"${o.dash?` stroke-dasharray="${o.dash}"`:''}${o.op!=null?` opacity="${o.op}"`:''}/>`;
}

function ellipseEl(x,y,rx,ry,o){
  o=o||{};
  return `<ellipse cx="${r2(x)}" cy="${r2(y)}" rx="${r2(rx)}" ry="${r2(ry)}" fill="${o.fill||'none'}" stroke="${o.stroke||COL.ink}" stroke-width="${o.sw||1.6}"${o.dash?` stroke-dasharray="${o.dash}"`:''}${o.op!=null?` opacity="${o.op}"`:''}/>`;
}

function txt(x,y,s,o){
  o=o||{};
  const cls = (o.mono?'mono ':'') + (o.cls||'');
  const fs = o.size||13;
  return `<text x="${r2(x)}" y="${r2(y)}" font-size="${fs}" text-anchor="${o.anchor||'middle'}" fill="${o.color||COL.ink}"${cls.trim()?` class="${cls.trim()}"`:''}${o.weight?` font-weight="${o.weight}"`:''}${o.op!=null?` opacity="${o.op}"`:''}${o.rot?` transform="rotate(${o.rot} ${r2(x)} ${r2(y)})"`:''}>${esc(s)}</text>`;
}

function labelWidth(s){
  let w=0;
  for(const ch of String(s)) w += /[\u4e00-\u9fa5]/.test(ch) ? 12.2 : 7.2;
  return w;
}

function badge(x,y,s,o){
  o=o||{};
  const w = labelWidth(s)+14, h=o.h||20;
  const col = o.color||COL.red;
  return `<g>`
    + `<rect x="${r2(x-w/2)}" y="${r2(y-h/2)}" width="${r2(w)}" height="${h}" rx="${o.rx==null?4:o.rx}" fill="${o.bg||'#fff'}" stroke="${col}" stroke-width="${o.sw||1}"${o.op!=null?` opacity="${o.op}"`:''}/>`
    + `<text x="${r2(x)}" y="${r2(y+4.2)}" text-anchor="middle" font-size="${o.size||12.5}" class="mono" fill="${col}" font-weight="${o.weight||500}">${esc(s)}</text>`
    + `</g>`;
}

/* 水平尺寸标注 */
function dimH(x1,x2,y,label,o){
  o=o||{};
  const col = o.color||COL.red;
  const a = Math.min(x1,x2), b = Math.max(x1,x2), mid=(a+b)/2;
  const w = labelWidth(label)+16;
  return `<g>`
    + line(a,y-6,a,y+6,{stroke:col,sw:1.3})
    + line(b,y-6,b,y+6,{stroke:col,sw:1.3})
    + line(a,y,b,y,{stroke:col,sw:1.3})
    + `<rect x="${r2(mid-w/2)}" y="${r2(y-10)}" width="${r2(w)}" height="20" rx="4" fill="#fff" stroke="${col}" stroke-width="1"/>`
    + txt(mid,y+4,label,{mono:true,size:12.5,color:col})
    + `</g>`;
}

/* 垂直尺寸标注 */
function dimV(y1,y2,x,label,o){
  o=o||{};
  const col = o.color||COL.red;
  const a = Math.min(y1,y2), b = Math.max(y1,y2), mid=(a+b)/2;
  const w = labelWidth(label)+14;
  return `<g>`
    + line(x-6,a,x+6,a,{stroke:col,sw:1.3})
    + line(x-6,b,x+6,b,{stroke:col,sw:1.3})
    + line(x,a,x,b,{stroke:col,sw:1.3})
    + `<rect x="${r2(x-w-7)}" y="${r2(mid-10)}" width="${r2(w)}" height="20" rx="4" fill="#fff" stroke="${col}" stroke-width="1"/>`
    + txt(x-w/2-7,mid+4,label,{mono:true,size:12.5,color:col})
    + `</g>`;
}

/* 角标 */
function angleArc(cx,cy,r,a0,a1,o){
  o=o||{};
  const col = o.color||COL.red;
  const sweep = a1-a0;
  const ccw = sweep < 0;
  const p0 = [cx+r*Math.cos(a0), cy+r*Math.sin(a0)];
  const p1 = [cx+r*Math.cos(a1), cy+r*Math.sin(a1)];
  const d = `M ${r2(cx)} ${r2(cy)} L ${r2(p0[0])} ${r2(p0[1])} A ${r2(r)} ${r2(r)} 0 0 ${ccw?0:1} ${r2(p1[0])} ${r2(p1[1])} Z`;
  return pathEl(d,{fill:o.fill||'none',stroke:col,sw:o.sw||1.2,op:o.op});
}

function sectorPath(cx,cy,r,a0,a1){
  const p0=[cx+r*Math.cos(a0), cy+r*Math.sin(a0)];
  const p1=[cx+r*Math.cos(a1), cy+r*Math.sin(a1)];
  return `M ${r2(cx)} ${r2(cy)} L ${r2(p0[0])} ${r2(p0[1])} A ${r2(r)} ${r2(r)} 0 ${Math.abs(a1-a0)>Math.PI?1:0} ${a1>a0?1:0} ${r2(p1[0])} ${r2(p1[1])} Z`;
}

/* 直角标记：顶点在 (x,y)，两条边分别朝 dir 与垂直方向 */
function rightAngle(x,y,dir,size,o){
  o=o||{};
  const col=o.color||COL.red;
  const s=size||11;
  const map={r:[1,0],l:[-1,0],u:[0,-1],d:[0,1]};
  const v=map[dir]||map.r;
  const pv=[-v[1],v[0]];
  const p1=[x+v[0]*s, y+v[1]*s];
  const p3=[x+pv[0]*s, y+pv[1]*s];
  const p2=[x+v[0]*s+pv[0]*s, y+v[1]*s+pv[1]*s];
  return pathEl(`M ${r2(p1[0])} ${r2(p1[1])} L ${r2(p2[0])} ${r2(p2[1])} L ${r2(p3[0])} ${r2(p3[1])}`,{stroke:col,sw:1.4});
}

/* 椭圆弧采样点（避免 SVG 弧线方向歧义） */
function ellArc(cx,cy,rx,ry,a0,a1,n){
  const pts=[];
  n=n||18;
  for(let i=0;i<=n;i++){
    const a=a0+(a1-a0)*i/n;
    pts.push([cx+rx*Math.cos(a), cy+ry*Math.sin(a)]);
  }
  return pts;
}

/* 方格纸 */
function paperLayer(){
  let g='';
  for(let x=20;x<=CW;x+=20){
    const bold = (x%100===0);
    g += `<line x1="${x}" y1="0" x2="${x}" y2="${CH}" stroke="${bold?COL.gridBold:COL.grid}" stroke-width="1"/>`;
  }
  for(let y=20;y<=CH;y+=20){
    const bold = (y%100===0);
    g += `<line x1="0" y1="${y}" x2="${CW}" y2="${y}" stroke="${bold?COL.gridBold:COL.grid}" stroke-width="1"/>`;
  }
  // 顶部/左侧刻度尺
  let r='';
  for(let x=0;x<=CW;x+=10){
    const big = (x%50===0);
    r += `<line x1="${x}" y1="0" x2="${x}" y2="${big?11:6}" stroke="${COL.ink3}" stroke-width="${big?1.1:.7}" opacity=".8"/>`;
  }
  for(let y=0;y<=CH;y+=10){
    const big = (y%50===0);
    r += `<line x1="0" y1="${y}" x2="${big?11:6}" y2="${y}" stroke="${COL.ink3}" stroke-width="${big?1.1:.7}" opacity=".8"/>`;
  }
  for(let x=100;x<CW;x+=100) r += `<text x="${x+3}" y="20" font-size="9" class="mono" fill="${COL.ink3}" opacity=".75">${x/10}</text>`;
  // 四角定位标记
  const marks = [[16,16],[CW-16,16],[16,CH-16],[CW-16,CH-16]];
  marks.forEach(m=>{
    r += `<line x1="${m[0]-6}" y1="${m[1]}" x2="${m[0]+6}" y2="${m[1]}" stroke="${COL.ink3}" stroke-width=".9" opacity=".55"/>`;
    r += `<line x1="${m[0]}" y1="${m[1]-6}" x2="${m[0]}" y2="${m[1]+6}" stroke="${COL.ink3}" stroke-width=".9" opacity=".55"/>`;
  });
  return `<g class="paper">${g}${r}</g>`;
}

/* 顶点标签 */
function vLabel(x,y,s,o){
  o=o||{};
  const dx = o.dx==null?0:o.dx, dy = o.dy==null?-9:o.dy;
  return txt(x+dx,y+dy,s,{size:o.size||13,color:o.color||COL.ink,weight:o.weight||500,anchor:o.anchor||'middle'});

/* ============================================================
   4. 初中模块
   ============================================================ */
function spanPair(ang1,ang2,theta){
  let d=ang2-ang1;
  while(d>Math.PI) d-=2*Math.PI;
  while(d<-Math.PI) d+=2*Math.PI;
  return d<0 ? [ang2,ang1] : [ang1,ang2];
}
function triSector(cx,cy,r,a0,a1,fill,stroke){
  const pts=[];
  pts.push([cx,cy]);
  for(let i=0;i<=6;i++){
    const a=a0+(a1-a0)*i/6;
    pts.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]);
  }
  return poly(pts,{fill:fill,stroke:stroke,sw:1.4,op:.9});
}

function angleSumRender(P,t){
  const A=P.A*Math.PI/180;
  const Bv=Math.min(P.B, 152-P.A);
  const B=Bv*Math.PI/180, C=Math.PI-A-B;
  const BC=340, Bx=280, By=400, Cx=Bx+BC, Cy=400;
  const AB=BC*Math.sin(C)/Math.sin(A);
  const Ax=Bx+AB*Math.cos(B), Ay=By-AB*Math.sin(B);
  const u=ease(t);
  const Pv=[450,504];
  const R=44;
  const verts=[
    {p:[Ax,Ay], th:A, names:['A',A*180/Math.PI]},
    {p:[Bx,By], th:B, names:['B',B*180/Math.PI]},
    {p:[Cx,Cy], th:C, names:['C',C*180/Math.PI]}
  ];
  // 各顶点内角的起始边方向
  const dirs=[];
  const pairs=[[ [Bx-Ax,By-Ay],[Cx-Ax,Cy-Ay] ],
               [ [Ax-Bx,Ay-By],[Cx-Bx,Cy-By] ],
               [ [Ax-Cx,Ay-Cy],[Bx-Cx,By-Cy] ]];
  let cum=0;
  const tgt=[];
  verts.forEach((v,i)=>{
    const a1=Math.atan2(pairs[i][0][1],pairs[i][0][0]);
    const a2=Math.atan2(pairs[i][1][1],pairs[i][1][0]);
    const sp=spanPair(a1,a2,v.th);
    dirs.push(sp);
    tgt.push([Math.PI+cum, Math.PI+cum+v.th]);
    cum+=v.th;
  });
  let out='';
  out += poly([[Ax,Ay],[Bx,By],[Cx,Cy]],{fill:'#fff',stroke:COL.ink,sw:1.8});
  out += txt(Ax-2,Ay-12,'A',{size:13,color:COL.ink2});
  out += txt(Bx-14,By+18,'B',{size:13,color:COL.ink2});
  out += txt(Cx+14,Cy+18,'C',{size:13,color:COL.ink2});
  const cols=[COL.red,COL.teal,COL.gold];
  verts.forEach((v,i)=>{
    const s0=dirs[i][0], s1=dirs[i][1];
    const ax=lerp(v.p[0],Pv[0],u), ay=lerp(v.p[1],Pv[1],u);
    const n0=near(s0,tgt[i][0]), n1=near(s1,tgt[i][1]);
    const b0=lerp(s0,n0,u), b1=lerp(s1,n1,u);
    out += triSector(ax,ay,R,b0,b1, i===0?COL.redSoft:(i===1?COL.tealSoft:COL.goldSoft), cols[i]);
    if(u<0.55){
      const mid=(b0+b1)/2;
      out += txt(ax+R*0.62*Math.cos(mid), ay+R*0.62*Math.sin(mid)+4, num(v.names[1],1)+'°', {size:11.5,mono:true,color:cols[i]});
    }
  });
  if(u>0.55){
    const o=r2(seg(t,.55,1));
    out += line(Pv[0]-R-30,Pv[1],Pv[0]+R+30,Pv[1],{stroke:COL.ink,sw:1.2,dash:'6 4',op:o});
    out += `<g opacity="${o}">`+txt(Pv[0],Pv[1]+34,'三个角正好拼成一条直线 = 180°',{size:13,color:COL.ink,weight:500})+`</g>`;
  }
  out += badge(450,74,'把三个角"撕"下来，拼在一起',{color:COL.teal,bg:'#fff'});
  return out;
}

function triSideRender(P,t){
  const sides=[P.a,P.b,P.c].slice().sort((x,y)=>y-x);
  const L=sides[0], s1=sides[1], s2=sides[2];
  const k=32, baseY=400;
  const xL=450-L*k/2, xR=xL+L*k;
  const valid = s1+s2 > L;
  let out='';
  out += line(xL,baseY,xR,baseY,{stroke:COL.ink,sw:2.2});
  out += dimH(xL,xR,baseY+34,'最长边 '+num(L));
  const u=ease(t);
  let Cx=xL, Cy=baseY;
  if(valid){
    const x=(L*L+s1*s1-s2*s2)/(2*L);
    const h=Math.sqrt(Math.max(0,s1*s1-x*x));
    Cx=xL+x*k; Cy=baseY-h*k;
  }
  // 两条边的摆动
  const angA = valid ? Math.atan2(Cy-baseY, Cx-xL) : 0;
  const angB = valid ? Math.atan2(Cy-baseY, Cx-xR) : Math.PI;
  const aa = lerp(0, angA, u);
  const ab = lerp(Math.PI, angB, u);
  const pA=[xL+s1*k*Math.cos(aa), baseY+s1*k*Math.sin(aa)];
  const pB=[xR+s2*k*Math.cos(ab), baseY+s2*k*Math.sin(ab)];
  out += line(xL,baseY,pA[0],pA[1],{stroke:COL.red,sw:2.4});
  out += line(xR,baseY,pB[0],pB[1],{stroke:COL.teal,sw:2.4});
  if(valid && u>0.9){
    out += poly([[xL,baseY],[xR,baseY],[Cx,Cy]],{fill:COL.goldSoft,stroke:COL.ink,sw:1.6,op:r2(seg(t,.9,1)*.92)});
    out += txt(Cx+12,Cy-8,'C',{size:13,color:COL.ink});
    out += txt(xL-14,baseY+18,'A',{size:13,color:COL.ink2});
    out += txt(xR+14,baseY+18,'B',{size:13,color:COL.ink2});
  }
  out += txt((xL+pA[0])/2-12,(baseY+pA[1])/2-6,num(s1),{size:12,mono:true,color:COL.red});
  out += txt((xR+pB[0])/2+12,(baseY+pB[1])/2-6,num(s2),{size:12,mono:true,color:COL.teal});
  if(!valid){
    out += badge(450,140,'两条短边加起来不够长，合不拢',{color:COL.red,bg:'#fff'});
    out += badge(450,178, num(s1)+' + '+num(s2)+' = '+num(s1+s2)+' ≤ '+num(L), {color:COL.red,bg:'#fff'});
  }
  out += badge(450,74,'任意两边之和必须大于第三边',{color:COL.teal,bg:'#fff'});
  if(valid && t>0.9) out += txt(450,baseY+74,'可以围成三角形',{size:14,color:COL.red,weight:600});
  return out;
}

function pythagorasRender(P,t){
  const a=P.a, b=P.b, k=28;
  const Ox=430, Oy=390;
  const A=[Ox+a*k,Oy], B=[Ox,Oy-b*k], O=[Ox,Oy];
  const c=Math.sqrt(a*a+b*b);
  const nx=b/c, ny=-a/c;
  const B2=[B[0]+nx*c*k, B[1]+ny*c*k];
  const A2=[A[0]+nx*c*k, A[1]+ny*c*k];
  const u=ease(t);
  let out='';
  // 三个正方形
  out += poly([[Ox,Oy],[Ox+a*k,Oy],[Ox+a*k,Oy+a*k],[Ox,Oy+a*k]],{fill:COL.goldSoft,stroke:COL.gold,sw:1.6,op:.85});
  out += poly([[Ox,Oy],[Ox,Oy-b*k],[Ox-b*k,Oy-b*k],[Ox-b*k,Oy]],{fill:COL.tealSoft,stroke:COL.teal,sw:1.6,op:.85});
  out += poly([A,B,B2,A2],{fill:COL.redSoft,stroke:COL.red,sw:1.6,op: r2(.55+.45*u)});
  // 三角形
  out += poly([O,A,B],{fill:'#fff',stroke:COL.ink,sw:1.8});
  out += rightAngle(Ox,Oy,'u',10,{color:COL.ink});
  out += txt((Ox+A[0])/2,Oy+22,'a = '+num(a),{size:12,mono:true,color:COL.ink});
  out += txt(Ox-16,(Oy+B[1])/2,'b = '+num(b),{size:12,mono:true,color:COL.ink});
  out += txt((A[0]+B[0])/2+14,(A[1]+B[1])/2-6,'c',{size:13,mono:true,color:COL.ink});
  out += txt(Ox+a*k/2,Oy+a*k/2+5,'a² = '+(a*a),{size:13,mono:true,color:'#8A6413'});
  out += txt(Ox-b*k/2,Oy-b*k/2+5,'b² = '+(b*b),{size:13,mono:true,color:COL.teal});
  const mx=(A[0]+B[0]+B2[0]+A2[0])/4, my=(A[1]+B[1]+B2[1]+A2[1])/4;
  out += txt(mx,my+5,'c² = '+num(c*c,1),{size:13,mono:true,color:COL.red,op:.7+.3*u});
  out += badge(450,74,'两个小正方形的面积和，正好等于大正方形',{color:COL.teal,bg:'#fff'});
  if(t>0.86){
    out += txt(450,520, num(a*a)+' + '+num(b*b)+' = '+num(c*c,2)+'  →  a² + b² = c²', {size:15,mono:true,color:COL.red,weight:600});
  }
  return out;
}

function congruentRender(P,t){
  const A=[330,170], B=[290,400], C=[580,390];
  const mode=P.mode;
  const rot0=0.26, dx=330, dy=10;
  const cen=[(A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3];
  const u=ease(t);
  function T(p){
    const ang=rot0*(1-u);
    const dx0=p[0]-cen[0], dy0=p[1]-cen[1];
    return [cen[0]+dx0*Math.cos(ang)-dy0*Math.sin(ang)+dx*(1-u),
            cen[1]+dx0*Math.sin(ang)+dy0*Math.cos(ang)+dy*(1-u)];
  }
  const A2=T(A),B2=T(B),C2=T(C);
  let out='';
  out += poly([A,B,C],{fill:COL.tealSoft,stroke:COL.teal,sw:1.8});
  out += poly([A2,B2,C2],{fill:COL.redSoft,stroke:COL.red,sw:1.8,op:.95});
  out += txt(A[0]-4,A[1]-12,'A',{size:12,color:COL.teal});
  out += txt(B[0]-14,B[1]+18,'B',{size:12,color:COL.teal});
  out += txt(C[0]+14,C[1]+14,'C',{size:12,color:COL.teal});
  out += txt(A2[0]-4,A2[1]-12,'D',{size:12,color:COL.red});
  out += txt(B2[0]-14,B2[1]+18,'E',{size:12,color:COL.red});
  out += txt(C2[0]+14,C2[1]+14,'F',{size:12,color:COL.red});
  // 判定条件标记
  function tick(x1,y1,x2,y2,n,col){
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    let s='';
    const ang=Math.atan2(y2-y1,x2-x1);
    for(let i=0;i<n;i++){
      const off=(i-(n-1)/2)*5;
      s+=`<line x1="${r2(mx+off*Math.cos(ang)-5*Math.sin(ang))}" y1="${r2(my+off*Math.sin(ang)+5*Math.cos(ang))}" x2="${r2(mx+off*Math.cos(ang)+5*Math.sin(ang))}" y2="${r2(my+off*Math.sin(ang)-5*Math.cos(ang))}" stroke="${col}" stroke-width="1.6"/>`;
    }
    return s;
  }
  if(mode==='sss'){
    out += tick(A[0],A[1],B[0],B[1],2,COL.teal)+tick(B[0],B[1],C[0],C[1],1,COL.teal)+tick(C[0],C[1],A[0],A[1],3,COL.teal);
    out += tick(A2[0],A2[1],B2[0],B2[1],2,COL.red)+tick(B2[0],B2[1],C2[0],C2[1],1,COL.red)+tick(C2[0],C2[1],A2[0],A2[1],3,COL.red);
  } else if(mode==='sas'){
    out += tick(A[0],A[1],B[0],B[1],1,COL.teal)+tick(B[0],B[1],C[0],C[1],2,COL.teal);
    out += tick(A2[0],A2[1],B2[0],B2[1],1,COL.red)+tick(B2[0],B2[1],C2[0],C2[1],2,COL.red);
    out += angleArc(B[0],B[1],26,Math.atan2(A[1]-B[1],A[0]-B[0]),Math.atan2(C[1]-B[1],C[0]-B[0]),{stroke:COL.teal,fill:COL.tealSoft});
    out += angleArc(B2[0],B2[1],26,Math.atan2(A2[1]-B2[1],A2[0]-B2[0]),Math.atan2(C2[1]-B2[1],C2[0]-B2[0]),{stroke:COL.red,fill:COL.redSoft});
  } else {
    out += tick(A[0],A[1],B[0],B[1],1,COL.teal);
    out += tick(A2[0],A2[1],B2[0],B2[1],1,COL.red);
    out += angleArc(A[0],A[1],30,Math.atan2(B[1]-A[1],B[0]-A[0]),Math.atan2(C[1]-A[1],C[0]-A[0]),{stroke:COL.teal,fill:COL.tealSoft});
    out += angleArc(C[0],C[1],30,Math.atan2(B[1]-C[1],B[0]-C[0]),Math.atan2(A[1]-C[1],A[0]-C[0]),{stroke:COL.teal,fill:COL.tealSoft});
    out += angleArc(A2[0],A2[1],30,Math.atan2(B2[1]-A2[1],B2[0]-A2[0]),Math.atan2(C2[1]-A2[1],C2[0]-A2[0]),{stroke:COL.red,fill:COL.redSoft});
    out += angleArc(C2[0],C2[1],30,Math.atan2(B2[1]-C2[1],B2[0]-C2[0]),Math.atan2(A2[1]-C2[1],A2[0]-C2[0]),{stroke:COL.red,fill:COL.redSoft});
  }
  const label = mode==='sss'?'SSS（边边边）':(mode==='sas'?'SAS（边角边）':'ASA（角边角）');
  out += badge(450,74,'判定方法：'+label,{color:COL.teal,bg:'#fff'});
  if(t>0.88) out += txt(450,505,'两个三角形完全重合 → 全等',{size:14,color:COL.red,weight:600});
  return out;
}

function paraDiagRender(P,t){
  const A=[280,400], B=[600,400], C=[680,180], D=[360,180];

  const ang=Math.PI*u;
  function R(p){

  out += line(B[0],B[1],D[0],D[1],{stroke:COL.ink,sw:1.3});
  out += poly([[A[0],A[1]],[B[0],B[1]],[O[0],O[1]]],{fill:COL.redSoft,stroke:COL.red,sw:1.4,op:r2(.25+.6*u)});
  out += poly([At,Bt,[O[0],O[1]]],{fill:COL.redSoft,stroke:COL.red,sw:1.8,op:.9});

  out += line((B[0]+O[0])/2,(B[1]+O[1])/2-5,(B[0]+O[0])/2,(B[1]+O[1])/2+5,{stroke:COL.teal,sw:2});
  out += line((D[0]+O[0])/2,(D[1]+O[1])/2-5,(D[0]+O[0])/2,(D[1]+O[1])/2+5,{stroke:COL.teal,sw:2});
  out += dot(O[0],O[1],4,{fill:COL.ink});
  out += txt(O[0]+10,O[1]-10,'O',{size:12,color:COL.ink});
  [['A',A,1],['B',B,1],['C',C,1],['D',D,1]].forEach(v=>{
    const dx=v[0]==='A'||v[0]==='D'?-16:(v[0]==='C'?14:14);

}

function inscribedRender(P,t){
  const O=[450,300], R=170;
  const th=P.th*Math.PI/180;
  const aA=-Math.PI/2-th/2, aB=-Math.PI/2+th/2;
  const A=[O[0]+R*Math.cos(aA),O[1]+R*Math.sin(aA)];
  const B=[O[0]+R*Math.cos(aB),O[1]+R*Math.sin(aB)];
  const major=2*Math.PI-th;
  const pAng=aB+0.10+major*0.78*ease(t);
  const Pp=[O[0]+R*Math.cos(pAng),O[1]+R*Math.sin(pAng)];
  let out='';
  out += ring(O[0],O[1],R,{stroke:COL.ink,sw:1.6,fill:'#fff'});
  out += line(O[0],O[1],A[0],A[1],{stroke:COL.teal,sw:1.3});
  out += line(O[0],O[1],B[0],B[1],{stroke:COL.teal,sw:1.3});
  out += line(Pp[0],Pp[1],A[0],A[1],{stroke:COL.red,sw:1.6});
  out += line(Pp[0],Pp[1],B[0],B[1],{stroke:COL.red,sw:1.6});
  out += line(A[0],A[1],B[0],B[1],{stroke:COL.ink3,sw:1,dash:'4 4'});
  out += angleArc(O[0],O[1],40,aA,aB,{stroke:COL.teal,fill:COL.tealSoft});
  out += angleArc(Pp[0],Pp[1],34,Math.atan2(A[1]-Pp[1],A[0]-Pp[0]),Math.atan2(B[1]-Pp[1],B[0]-Pp[0]),{stroke:COL.red,fill:COL.redSoft});
  out += dot(O[0],O[1],3.5,{fill:COL.ink});
  out += txt(O[0]-14,O[1]+18,'O',{size:12,color:COL.ink});
  out += txt(A[0]-16,A[1]+2,'A',{size:12,color:COL.teal});
  out += txt(B[0]+16,B[1]+2,'B',{size:12,color:COL.teal});
  out += txt(Pp[0],Pp[1]+(Pp[1]<O[1]?-14:24),'P',{size:12,color:COL.red});
  const bisV=(a,b,c)=>{ const ax=a[0]-c[0],ay=a[1]-c[1],bx=b[0]-c[0],by=b[1]-c[1];
    const la=Math.hypot(ax,ay)||1, lb=Math.hypot(bx,by)||1;
    let vx=ax/la+bx/lb, vy=ay/la+by/lb; const m=Math.hypot(vx,vy)||1; return [vx/m,vy/m]; };
  const bO=bisV(A,B,O), bP=bisV(A,B,Pp);
  out += txt(O[0]+bO[0]*64,O[1]+bO[1]*64+4,num(P.th,0)+'°',{size:12,mono:true,color:COL.teal,weight:600});
  out += txt(Pp[0]+bP[0]*52,Pp[1]+bP[1]*52+4,num(P.th/2,1)+'°',{size:12,mono:true,color:COL.red,weight:600});
  out += badge(450,74,'P 在弧上移动，∠APB 始终不变',{color:COL.teal,bg:'#fff'});
  if(t>0.86) out += txt(450,520,'同弧所对的圆周角 = 圆心角的一半',{size:13.5,color:COL.red,weight:500});
  return out;
}

function chordRender(P,t){
  const O=[450,300], R=170;
  const y=380, w=120;
  const A=[O[0]-w,y], B=[O[0]+w,y], M=[O[0],y];
  const u=ease(t);
  let out='';
  out += ring(O[0],O[1],R,{stroke:COL.ink,sw:1.6,fill:'#fff'});
  // 左半翻折
  const halfPath = `M ${O[0]} ${O[1]-R} A ${R} ${R} 0 0 1 ${O[0]} ${O[1]+R} L ${O[0]} ${O[1]} Z`;
  out += `<g transform="translate(${r2(2*O[0]*u)},0) scale(${r2(1-2*u)},1)">`
    + pathEl(halfPath,{fill:COL.redSoft,stroke:COL.red,sw:1.4,op:.55})
    + line(O[0]-w,y,O[0],y,{stroke:COL.red,sw:2.2})
    + dot(A[0],A[1],4,{fill:COL.red})
    + `</g>`;
  out += line(A[0],A[1],B[0],B[1],{stroke:COL.ink,sw:2.2});
  out += line(O[0],O[1],M[0],M[1],{stroke:COL.teal,sw:1.6});
  out += rightAngle(M[0],M[1],'u',10,{color:COL.teal});
  out += dot(O[0],O[1],3.5,{fill:COL.ink});
  out += dot(B[0],B[1],4,{fill:COL.ink});
  out += dot(M[0],M[1],3.5,{fill:COL.teal});
  out += txt(O[0]-12,O[1]+18,'O',{size:12,color:COL.ink});
  out += txt(A[0]-16,A[1]+4,'A',{size:12,color:COL.red});
  out += txt(B[0]+16,B[1]+4,'B',{size:12,color:COL.ink});
  out += txt(M[0]+12,M[1]+18,'M',{size:12,color:COL.teal});
  out += badge(450,74,'沿直径把圆对折，A 与 B 重合',{color:COL.teal,bg:'#fff'});
  if(t>0.85) out += txt(450,520,'垂直于弦的直径平分弦：AM = MB',{size:13.5,color:COL.red,weight:500});
  return out;
}

function tangentRender(P,t){
  const O=[430,300], R=140;
  const A=[O[0]+R,O[1]];
  const phi=(18+72*ease(t))*Math.PI/180;
  const dir=[Math.cos(phi),Math.sin(phi)];
  const d=Math.abs((A[0]-O[0])*dir[1]-(A[1]-O[1])*dir[0]);
  const proj=(A[0]-O[0])*dir[0]+(A[1]-O[1])*dir[1];
  const foot=[O[0]+proj*dir[0], O[1]+proj*dir[1]];
  let out='';
  out += ring(O[0],O[1],R,{stroke:COL.ink,sw:1.6,fill:'#fff'});
  // 直线
  out += line(A[0]-dir[0]*230,A[1]-dir[1]*230,A[0]+dir[0]*230,A[1]+dir[1]*230,{stroke:COL.teal,sw:1.8});
  if(d<R-0.5){
    const half=Math.sqrt(R*R-d*d);
    const p1=[foot[0]+half*dir[0],foot[1]+half*dir[1]];
    const p2=[foot[0]-half*dir[0],foot[1]-half*dir[1]];
    out += dot(p1[0],p1[1],4,{fill:COL.teal});
    out += dot(p2[0],p2[1],4,{fill:COL.teal});
  }
  out += line(O[0],O[1],foot[0],foot[1],{stroke:COL.red,sw:1.4,dash:'5 3'});
  out += rightAngle(foot[0],foot[1],'r',9,{color:COL.red});
  out += line(O[0],O[1],A[0],A[1],{stroke:COL.ink,sw:1.6});
  out += dot(O[0],O[1],3.5,{fill:COL.ink});
  out += dot(A[0],A[1],4.5,{fill:COL.red});
  out += txt(O[0]-14,O[1]+18,'O',{size:12,color:COL.ink});
  out += txt(A[0]+14,A[1]+16,'A',{size:12,color:COL.red});
  out += txt(R/2+O[0],O[1]-10,'r',{size:12,mono:true,color:COL.ink});
  const tang = d>R-0.5;
  out += badge(450,74, tang?'直线与圆只有一个公共点：相切':'直线与圆有两个公共点：相交',{color:tang?COL.red:COL.teal,bg:'#fff'});
  out += badge(450,470,'圆心到直线的距离 d = '+num(d/1,1)+'   半径 r = '+num(R),{color:COL.ink2,bg:'#fff'});
  if(t>0.9) out += txt(450,512,'d = r 时相切，且切线垂直于过切点的半径',{size:13.5,color:COL.red,weight:500});
  return out;
}

function midsegRender(P,t){
  const A=[450,140], B=[250,430], C=[670,430];
  const D=[(A[0]+B[0])/2,(A[1]+B[1])/2];
  const E=[(A[0]+C[0])/2,(A[1]+C[1])/2];
  const F=[2*E[0]-D[0], 2*E[1]-D[1]];
  const u=ease(t), ang=Math.PI*u;
  function R(p){
    const dx=p[0]-E[0], dy=p[1]-E[1];
    return [E[0]+dx*Math.cos(ang)-dy*Math.sin(ang), E[1]+dx*Math.sin(ang)+dy*Math.cos(ang)];
  }
  const At=R(A), Dt=R(D);
  let out='';
  out += poly([A,B,C],{fill:COL.tealSoft,stroke:COL.teal,sw:1.8,op:.6});
  out += line(D[0],D[1],F[0],F[1],{stroke:COL.ink,sw:1.2,dash:'4 3'});
  out += line(F[0],F[1],C[0],C[1],{stroke:COL.ink,sw:1.4,dash:'4 3'});
  out += poly([[A[0],A[1]],[D[0],D[1]],[E[0],E[1]]],{fill:COL.redSoft,stroke:COL.red,sw:1.4,op:r2(.3+.6*u)});
  out += poly([At,Dt,[E[0],E[1]]],{fill:COL.redSoft,stroke:COL.red,sw:1.8,op:.92});
  out += line(D[0],D[1],E[0],E[1],{stroke:COL.red,sw:2.4});
  out += line(D[0],D[1],F[0],F[1],{stroke:COL.red,sw:2.4,op:u});
  [['A',A,-4,-12],['B',B,-16,18],['C',C,16,18]].forEach(v=>out+=txt(v[1][0]+v[2],v[1][1]+v[3],v[0],{size:12,color:COL.ink}));
  out += txt(D[0]-16,D[1],'D',{size:12,color:COL.red});
  out += txt(E[0]+16,E[1],'E',{size:12,color:COL.red});
  if(u>0.6) out += txt(F[0]+14,F[1],'F',{size:12,color:COL.red,op:r2(seg(t,.6,1))});
  // 相等标记
  out += line(D[0],D[1]-5,D[0],D[1]+5,{stroke:COL.ink3,sw:1.6});
  out += line(A[0]+(D[0]-A[0])/2-5,A[1]+(D[1]-A[1])/2,A[0]+(D[0]-A[0])/2+5,A[1]+(D[1]-A[1])/2,{stroke:COL.ink3,sw:1.6});
  out += badge(450,74,'D、E 是中点，把 △ADE 旋转 180°',{color:COL.teal,bg:'#fff'});
  if(t>0.86) out += txt(450,530,'DE ∥ BC，且 DE = ½ BC',{size:13.5,color:COL.red,weight:500});
  return out;
}

function perimRender(P,t,isSquare){
  const a = P.a, b = isSquare ? P.a : P.b;
  const k = 46;
  const w = a*k, h = b*k;
  const x0 = 450 - w/2, y0 = 290 - h/2;
  const x1 = x0+w, y1 = y0+h;
  const L = 2*(w+h);
  // 周长路径（从左上角顺时针）
  let segs = [
    {x:x0,y:y0,dx:1,dy:0,len:w},
    {x:x1,y:y0,dx:0,dy:1,len:h},
    {x:x1,y:y1,dx:-1,dy:0,len:w},
    {x:x0,y:y1,dx:0,dy:-1,len:h}
  ];
  const dist = L*t;
  let acc = 0, mx=x0, my=y0;
  for(const s of segs){
    if(dist <= acc + s.len){
      const p = (dist-acc)/s.len;
      mx = s.x + s.dx*s.len*p; my = s.y + s.dy*s.len*p;
      break;
    }
    acc += s.len;
  }
  if(dist >= L) { mx=x0; my=y0; }
  let out = '';
  out += `<rect x="${r2(x0)}" y="${r2(y0)}" width="${r2(w)}" height="${r2(h)}" fill="${COL.tealSoft}" opacity=".55"/>`;
  // 四条边标注
  out += dimH(x0,x1,y0-30, isSquare?'a = '+num(a)+'cm':'a = '+num(a)+'cm');
  out += dimV(y0,y1,x0-34, (isSquare?'a = ':'b = ')+num(b)+'cm');
  // 已走过的周长
  out += `<rect x="${r2(x0)}" y="${r2(y0)}" width="${r2(w)}" height="${r2(h)}" fill="none" stroke="${COL.ink}" stroke-width="1.6"/>`;
  if(dist>0){
    let remain = dist, dstr = '';
    for(const s of segs){
      const take = Math.min(s.len, remain);
      if(take>0) dstr += `L ${r2(s.x+s.dx*take)} ${r2(s.y+s.dy*take)} `;
      remain -= take;
      if(remain<=0) break;
    }
    out += pathEl('M '+r2(x0)+' '+r2(y0)+' '+dstr, {stroke:COL.red,sw:5,op:.92});
  }
  out += ring(mx,my,6,{fill:COL.red,stroke:'#fff',sw:2});
  out += badge(450, y0-72, '周长 C = '+num(L/k)+' cm', {color:COL.red,bg:'#fff'});
  if(t>0.86){
    const f = isSquare ? 'C = 4×a' : 'C = 2×(a+b)';
    out += txt(450, y1+52, f+' = '+num(L/k)+' cm', {size:15, mono:true, color:COL.red, weight:600});
  }
  return out;
}

function circleAreaRender(P,t){
  const r=P.r, n=P.n, k=42, R=r*k;
  const cxx=450, cyy=168;
  const th=2*Math.PI/n;
  const w=R*th;
  const yTop=cyy+R+66;
  const xL=450-Math.PI*R/2;
  const u=ease(t);
  let out='';
  // 目标长方形虚线
  if(t>.55){
    out += `<rect x="${r2(xL)}" y="${r2(yTop)}" width="${r2(Math.PI*R)}" height="${r2(R)}" fill="none" stroke="${COL.red}" stroke-width="1.2" stroke-dasharray="7 4" opacity="${r2(seg(t,.55,1)*.8)}"/>`;
  }
  for(let i=0;i<n;i++){
    const even = (i%2===0);
    const j = Math.floor(i/2);
    const a0c = i*th;
    const p0=[cxx,cyy], rot0=near(a0c+th/2, a0c+th/2);
    let tx, ty, trot;
    if(even){
      tx = xL + (j+0.5)*w; ty = yTop+R; trot = -Math.PI/2;
    } else {
      tx = xL + (j+1)*w;     ty = yTop;   trot = Math.PI/2;
    }
    const rr = near(trot, rot0);
    const ax = lerp(p0[0], tx, u), ay = lerp(p0[1], ty, u);
    const rot = lerp(rot0, rr, u);
    const pts=[];
    const steps=5;
    for(let q=0;q<=steps;q++){
      const an = rot + (-th/2 + th*q/steps);
      pts.push([ax+R*Math.cos(an), ay+R*Math.sin(an)]);
    }
    out += poly(pts,{fill: even?COL.tealSoft:COL.goldSoft, stroke: even?COL.teal:COL.gold, sw:1, op:.95});
  }
  out += `<circle cx="${r2(cxx)}" cy="${r2(cyy)}" r="${r2(R)}" fill="none" stroke="${COL.ink}" stroke-width="1.4" opacity="${r2(1-u*0.7)}"/>`;
  out += dot(cxx,cyy,3,{fill:COL.ink,op:1-u});
  if(u>.85){
    out += dimH(xL,xL+Math.PI*R, yTop+R+42, '≈ πr = '+num(Math.PI*r)+'cm');
    out += dimV(yTop,yTop+R, xL-26, '≈ r = '+num(r)+'cm');
  }
  out += badge(450,72,'把圆分成 '+n+' 个小扇形，正反相拼',{color:COL.teal,bg:'#fff'});
  if(t>0.92){
    out += txt(450, yTop+R+86, 'S = πr² ≈ 3.14 × '+num(r)+'² = '+num(Math.PI*r*r)+' cm²', {size:15,mono:true,color:COL.red,weight:600});
  }
  return out;
}

/* ---------- 3D 折纸引擎（立体展开图） ---------- */
function rotAxis3(p, anchor, axis, ang){
  const vx=p[0]-anchor[0], vy=p[1]-anchor[1], vz=p[2]-anchor[2];
  const c=Math.cos(ang), s=Math.sin(ang);
  const kx=axis[0], ky=axis[1], kz=axis[2];
  const kd = kx*vx+ky*vy+kz*vz;
  const cx = ky*vz-kz*vy, cy = kz*vx-kx*vz, cz = kx*vy-ky*vx;
  return [
    anchor[0]+vx*c+cx*s+kx*kd*(1-c),
    anchor[1]+vy*c+cy*s+ky*kd*(1-c),
    anchor[2]+vz*c+cz*s+kz*kd*(1-c)
  ];
}
function foldPoint(p, hinges, f){
  let q=[p[0],p[1],p[2]];
  for(const h of hinges){ q = rotAxis3(q, h.anchor, h.axis, h.ang*f); }
  return q;
}
function camProj(p, ang){
  const beta=ang*0.74, alpha=ang*0.48;
  const cb=Math.cos(beta), sb=Math.sin(beta);
  const x1=p[0]*cb+p[2]*sb;
  const z1=-p[0]*sb+p[2]*cb;
  const ca=Math.cos(alpha), sa=Math.sin(alpha);
  const y2=p[1]*ca-z1*sa;
  return [x1,-y2,z1*ca+p[1]*sa];
}

const AX = 1.05; // 初始镜头倾角

function boxScene(W,H,D){
  const faces=[];
  const add=(id,quad,fill,label,hinges)=>{
    faces.push({id, quad, fill, label, hinges});
  };
  const Y=[0,1,0], X=[1,0,0];
  // 前（根面）
  add('front', [[0,0,0],[W,0,0],[W,H,0],[0,H,0]], '#FBE8C4', '前', []);
  // 右（挂在前面的右棱 x=W）
  add('right', [[W,0,0],[W+D,0,0],[W+D,H,0],[W,H,0]], '#D3E4E7', '右',
    [{anchor:[W,0,0],axis:Y,ang:Math.PI/2}]);
  // 后（挂在右面的远端棱 x=W+D）
  add('back', [[W+D,0,0],[2*W+D,0,0],[2*W+D,H,0],[W+D,H,0]], '#DCE5ED', '后',
    [{anchor:[W+D,0,0],axis:Y,ang:Math.PI/2},
     {anchor:[W,0,0],axis:Y,ang:Math.PI/2}]);
  // 左（挂在后面的远端棱 x=2W+D）
  add('left', [[2*W+D,0,0],[2*W+2*D,0,0],[2*W+2*D,H,0],[2*W+D,H,0]], '#F8D9D2', '左',
    [{anchor:[2*W+D,0,0],axis:Y,ang:Math.PI/2},
     {anchor:[W+D,0,0],axis:Y,ang:Math.PI/2},
     {anchor:[W,0,0],axis:Y,ang:Math.PI/2}]);
  // 上（挂在前面的上棱 y=H）
  add('top', [[0,H,0],[W,H,0],[W,H+D,0],[0,H+D,0]], '#F2D49B', '上',
    [{anchor:[0,H,0],axis:X,ang:-Math.PI/2}]);
  // 下（挂在前面的下棱 y=0）
  add('bottom', [[0,-D,0],[W,-D,0],[W,0,0],[0,0,0]], '#C9DDE2', '下',
    [{anchor:[0,0,0],axis:X,ang:Math.PI/2}]);
  return faces;
}

function pipOuter(pts,x,y){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
    if(((yi>y)!=(yj>y)) && (x < (xj-xi)*(y-yi)/((yj-yi)||1e-9)+xi)) inside=!inside;
  }
  return inside;
}
function unfoldRender(faces, t){
  const u=ease(t);
  const f=1-u, ang=AX*(1-u);
  function bounds(ff,aa){
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for(const face of faces){
      for(const q of face.quad){
        const p=camProj(foldPoint(q,face.hinges,ff),aa);
        x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]);
        y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]);
      }
    }
    return {w:x1-x0,h:y1-y0};
  }
  const b0=bounds(1,AX), b1=bounds(0,0);
  const s=Math.min(800/Math.max(b0.w,b1.w), 400/Math.max(b0.h,b1.h));
  // 当前帧投影 + 整体包围盒（保证任意时刻都居中）
  const frames=[]; let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const face of faces){
    const p3=[]; let dz=0;
    for(const q of face.quad){
      const p=camProj(foldPoint(q,face.hinges,f),ang);
      p3.push(p); dz+=p[2];
      x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]);
      y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]);
    }
    frames.push({face,p3,dz:dz/4});
  }
  const offx=450-(x0+x1)/2*s, offy=300-(y0+y1)/2*s;
  const segs=frames.map(fr=>{
    const pts=fr.p3.map(p=>[offx+p[0]*s, offy+p[1]*s]);
    const cx=(pts[0][0]+pts[1][0]+pts[2][0]+pts[3][0])/4;
    const cy=(pts[0][1]+pts[1][1]+pts[2][1]+pts[3][1])/4;
    return {pts,dz:fr.dz,fill:fr.face.fill,label:fr.face.label,cx,cy};
  });
  segs.sort((a,b)=>a.dz-b.dz);
  let out='';
  for(let i=0;i<segs.length;i++){
    const sg=segs[i];
    out += poly(sg.pts,{fill:sg.fill,stroke:COL.ink,sw:1.3,op:.97});
    // 被后画的面盖住时，标签一并隐藏，避免半截文字
    let covered=false;
    for(let j=i+1;j<segs.length;j++){ if(pipOuter(segs[j].pts,sg.cx,sg.cy)){ covered=true; break; } }
    if(!covered) out += txt(sg.cx,sg.cy+4,sg.label,{size:12,color:COL.ink,weight:500,op:.5});
  }
  out += badge(450,78, t<.3?'立体图形：六个面围成' : (t>0.9?'展开图：六个面平铺在同一个平面上':'正在把每个面沿棱翻折摊平'), {color:COL.teal,bg:'#fff'});
  return out;
}

/* ---------- 圆柱 / 圆锥展开 ---------- */
function cylinderNetRender(P,t){
  const r=P.r, h=P.h, k=30;
  const R=r*k, H=h*k;
  const cx=450, cy=280;
  const u=ease(t);
  const halfW = lerp(R, Math.PI*R, u);
  const rySide = R*0.34*(1-u);
  const ryC = lerp(R*0.34, R, u);
  const yTop = cy-H/2, yBot = cy+H/2;
  const circY = lerp(0, R, u);
  let out='';
  // 下底圆（先画，被侧面压住一部分）
  out += ellipseEl(cx, yBot+circY, R, ryC, {stroke:COL.ink,sw:1.5,fill:COL.goldSoft});
  // 侧面
  const d = `M ${r2(cx-halfW)} ${r2(yTop)} Q ${r2(cx)} ${r2(yTop+rySide*1.34)} ${r2(cx+halfW)} ${r2(yTop)} L ${r2(cx+halfW)} ${r2(yBot)} Q ${r2(cx)} ${r2(yBot-rySide*1.34)} ${r2(cx-halfW)} ${r2(yBot)} Z`;
  out += pathEl(d,{fill:COL.tealSoft,stroke:COL.teal,sw:1.7,op:.96});
  // 上底圆
  out += ellipseEl(cx, yTop-circY, R, ryC, {stroke:COL.ink,sw:1.5,fill:COL.goldSoft});
  if(u>0.62){
    const o=r2(seg(t,.62,1));
    out += dimH(cx-halfW,cx+halfW, yBot+2*R+34, '长 = 2πr ≈ '+num(2*Math.PI*r)+'cm', {color:COL.red});
    out += `<g opacity="${o}">${dimV(yTop,yBot, cx+halfW+30, '宽 = h')}</g>`;
  }
  out += badge(450,64, u>0.72?'侧面展开是长方形，上下是两个圆':'圆柱由 1 个侧面 + 2 个底面圆围成',{color:COL.teal,bg:'#fff'});
  return out;
}

function coneNetRender(P,t){
  const r=P.r, h=P.h, k=28;
  const R=r*k, H=h*k;
  const l=Math.sqrt(r*r+h*h);
  const L=l*k;
  const th0=2*Math.atan2(r,h);          // 圆锥母线与轴的夹角×2
  const th1=2*Math.PI*r/l;              // 扇形圆心角
  const th=lerp(th0,th1,ease(t));
  const apexY = 288 - (L+2*R)/2;
  const cx=450;
  const circY = lerp(H/2, L+R, ease(t)) - H/2 + 0;
  let out='';
  // 底圆
  const baseCy = apexY + lerp(H, L+R, ease(t));
  out += ellipseEl(cx, baseCy, R, lerp(R*0.34,R,ease(t)), {stroke:COL.ink,sw:1.5,fill:COL.goldSoft});
  // 侧面扇形
  const a0=-th/2, a1=th/2;
  const p0=[cx+L*Math.sin(a0), apexY+L*Math.cos(a0)];
  const p1=[cx+L*Math.sin(a1), apexY+L*Math.cos(a1)];
  const arcPts=[];
  const steps=24;
  const bulge = (1-ease(t))*R*0.34;
  for(let i=0;i<=steps;i++){
    const a=a0+(a1-a0)*i/steps;
    arcPts.push([cx+L*Math.sin(a), apexY+L*Math.cos(a)+ (i===0||i===steps?0:0)]);
  }
  // 展开初期的下缘用椭圆弧代替（用 bulge 做微小弯曲）
  const d = 'M '+r2(cx)+' '+r2(apexY)+' L '+r2(p0[0])+' '+r2(p0[1])+' '
    + arcPts.slice(1).map(p=>'L '+r2(p[0])+' '+r2(p[1])).join(' ')
    + ' Z';
  out += pathEl(d,{fill:COL.tealSoft,stroke:COL.teal,sw:1.7,op:.95});
  out += dot(cx,apexY,3,{fill:COL.ink});
  // 母线标注
  out += line(cx,apexY, p0[0],p0[1], {stroke:COL.red,sw:1.2,dash:'5 3'});
  out += txt((cx+p0[0])/2-16,(apexY+p0[1])/2, 'l = '+num(l)+'cm',{size:11.5,color:COL.red,mono:true});
  out += badge(450,66, t>0.75?'侧面展开是扇形，半径 = 母线 l':'圆锥的侧面展开后是一个扇形',{color:COL.teal,bg:'#fff'});
  return out;
}

/* ---------- 体积 ---------- */
function isoBox(a,b,c,s,cx,cy,opt){
  opt=opt||{};
  const c30=0.866, s30=0.5;
  function P(x,y,z){ return [cx+((x-z)*c30)*s, cy+((x+z)*s30-y)*s]; }
  let out='';
  const list=[];
  for(let y=0;y<c;y++) for(let x=0;x<a;x++) for(let z=0;z<b;z++){
    list.push({x,y,z,d:x+z+y*0.01});
  }
  list.sort((p,q)=>p.d-q.d);
  const N = opt.count==null ? list.length : opt.count;
  let idx=0;
  for(const cu of list){
    if(idx>=N) { idx++; continue; }
    const x=cu.x, y=cu.y, z=cu.z;
    const top=[P(x,y+1,z),P(x+1,y+1,z),P(x+1,y+1,z+1),P(x,y+1,z+1)];
    const rt =[P(x+1,y,z),P(x+1,y+1,z),P(x+1,y+1,z+1),P(x+1,y,z+1)];
    const fr =[P(x,y,z+1),P(x+1,y,z+1),P(x+1,y+1,z+1),P(x,y+1,z+1)];
    const hl = idx===N-1;
    out += poly(rt,{fill: hl?COL.tealSoft:'#CDDDE2', stroke: hl?COL.teal:COL.ink2, sw:hl?1.5:.8});
    out += poly(fr,{fill: hl?COL.goldSoft:'#E3ECF1', stroke: hl?COL.gold:COL.ink2, sw:hl?1.5:.8});
    out += poly(top,{fill: hl?'#F7D9A0':'#EFF4F8', stroke: hl?COL.gold:COL.ink2, sw:hl?1.5:.8});
    idx++;
  }
  return out;
}

function cuboidVolumeRender(P,t){
  const a=P.a, b=P.b, c=P.c, s=36;
  const total=a*b*c;
  const n=Math.floor(total*t+0.0001);
  const cx=450-((a-b)*0.866*s)/2;
  const cy=300-(((a+b)/2-c)/2)*s;
  let out='<g opacity=".26">'+isoBox(a,b,c,s,cx,cy,{count:total})+`</g>`;
  out+=isoBox(a,b,c,s,cx,cy,{count:n});
  out+=badge(450,64,'每层 '+a+' × '+b+' = '+(a*b)+' 个小正方体，共 '+c+' 层',{color:COL.teal,bg:'#fff'});
  out+=badge(450,514,'已放入 '+n+' / '+total+' 个 1cm³ 小正方体',{color:COL.red,bg:'#fff'});
  if(t>0.92){
    out+=txt(450,102,'V = a×b×c = '+a+'×'+b+'×'+c+' = '+total+' cm³',{size:15,mono:true,color:COL.red,weight:600});
  }
  return out;
}

function cylBody(cx,baseY,R,ry,fh){
  if(fh<2) return '';
  const pts=[];
  pts.push([cx-R,baseY]);
  pts.push([cx-R,baseY-fh]);
  for(let i=0;i<=12;i++){
    const ang=Math.PI+Math.PI*i/12;
    pts.push([cx+R*Math.cos(ang), baseY-fh+ry*Math.sin(ang)]);
  }
  pts.push([cx+R,baseY]);
  for(let i=0;i<=12;i++){
    const ang=Math.PI*i/12;
    pts.push([cx+R*Math.cos(ang), baseY+ry*Math.sin(ang)]);
  }
  return poly(pts,{fill:COL.tealSoft,stroke:'none',op:.92});
}

function cylinderVolumeRender(P,t){
  const r=P.r, h=P.h, k=44, R=r*k, H=h*k;
  const cx=450, baseY=430;
  const u=ease(t);
  const ry=R*0.3;
  let out='';
  out += ellipseEl(cx,baseY,R,ry,{stroke:COL.ink,sw:1.6,fill:COL.goldSoft});
  out += line(cx-R,baseY,cx-R,baseY-H,{stroke:COL.ink,sw:1.5});
  out += line(cx+R,baseY,cx+R,baseY-H,{stroke:COL.ink,sw:1.5});
  // 填充
  const fillH = H*u;
  if(fillH>2){
    out += cylBody(cx,baseY,R,ry,fillH);
    out += ellipseEl(cx,baseY-fillH,R,ry,{stroke:COL.teal,sw:1.3,fill:'#fff',op:.92});
  }
  out += ellipseEl(cx,baseY-H,R,ry,{stroke:COL.ink,sw:1.6,fill:'none'});
  out += dimH(cx-R,cx+R,baseY+ry+34,'直径 2r = '+num(2*r)+'cm');
  out += dimV(baseY-H,baseY,cx-R-30,'h = '+num(h)+'cm');
  out += badge(450,74,'把底面向上平移 h，扫过的空间就是体积',{color:COL.teal,bg:'#fff'});
  if(t>0.85){
    out += txt(450,baseY+ry+76,'V = πr² × h = '+num(Math.PI*r*r)+' × '+num(h)+' ≈ '+num(Math.PI*r*r*h)+' cm³',{size:14,mono:true,color:COL.red,weight:600});
  }
  return out;
}

function coneVolumeRender(P,t){
  const r=P.r, h=P.h, k=30, R=r*k, H=h*k;
  const cylX=300, coneX=600, baseY=420;
  const u=t*3;
  const step=Math.min(2, Math.floor(u));
  const loc=clamp(u-step,0,1);
  const level=(step+ease(loc))/3;
  const ry=R*0.28;
  let out='';
  // 圆柱
  const cyTop=baseY-H;
  out += ellipseEl(cylX,baseY,R,ry,{stroke:COL.ink,sw:1.5,fill:COL.goldSoft});
  out += line(cylX-R,baseY,cylX-R,cyTop,{stroke:COL.ink,sw:1.4});
  out += line(cylX+R,baseY,cylX+R,cyTop,{stroke:COL.ink,sw:1.4});
  const fh=H*level;
  if(fh>2){
    out += cylBody(cylX,baseY,R,ry,fh);
    out += ellipseEl(cylX,baseY-fh,R,ry,{stroke:COL.teal,sw:1.2,fill:'#fff',op:.9});
  }
  out += ellipseEl(cylX,cyTop,R,ry,{stroke:COL.ink,sw:1.5,fill:'none'});
  out += txt(cylX,baseY+ry+30,'圆柱',{size:12,color:COL.ink2});
  // 圆锥
  const tilt = loc*26;
  const apex=[coneX, baseY-H];
  out += ellipseEl(coneX,baseY,R,ry,{stroke:COL.ink,sw:1.5,fill:COL.goldSoft});
  out += poly([[coneX-R,baseY],[coneX,baseY-H],[coneX+R,baseY]],{fill:COL.redSoft,stroke:COL.red,sw:1.6});
  out += txt(coneX,baseY+ry+30,'等底等高的圆锥',{size:12,color:COL.ink2});
  // 倒水提示
  out += txt((cylX+coneX)/2, baseY-H-30, '→', {size:26,color:COL.red,weight:600,op:.7});
  out += badge(450,74,'第 '+(step+1)+' 次倒满：圆锥容积 = 圆柱的 1/3',{color:COL.teal,bg:'#fff'});
  out += badge(cylX, cyTop-38, num(level*100,0)+'%', {color:COL.red,bg:'#fff'});
  if(t>0.9){
    out += txt(450,baseY+96,'V锥 = πr²h ÷ 3 ≈ '+num(Math.PI*r*r*h/3)+' cm³',{size:15,mono:true,color:COL.red,weight:600});
  }
  return out;
}

function matchProof(text){
  const s=String(text||'');
  let best=null, bestScore=0;
  for(const p of PROOFS){
    let score=0;
    for(const k of p.kw){ if(s.indexOf(k)>=0) score++; }
    const needOk = p.need.some(n=> s.indexOf(n)>=0);
    if(!needOk) continue;
    score += 2;
    if(score>bestScore){ bestScore=score; best=p; }
  }
  return best;
}

  const groups=[];
  arr.forEach(t=>{
    let g=groups.filter(x=>x.name===t.group)[0];
    if(!g){ g={name:t.group,items:[]}; groups.push(g); }
    g.items.push(t);
  });
  let n=0;
  el.innerHTML = groups.map(g=>{
    const items = g.items.map(t=>{
      n++;
      return `<button class="t-item" data-topic="${t.id}" aria-current="${t.id===ST.id}"><span class="idx">${String(n).padStart(2,'0')}</span><span>${t.name}</span></button>`;
    }).join('');
    return `<div class="grp"><div class="grp-title">${g.name}</div>${items}</div>`;
  }).join('');
  $$('[data-topic]',el).forEach(b=>{
    b.onclick=()=>{ selectTopic(b.getAttribute('data-topic')); };
  });
}

function selectTopic(id){
  if(ST.id===id) return;
  ST.id=id; ST.t=0; ST.playing=false;
  renderRail(); renderMain(); startPlay();
}

/* ---------- 主区 ---------- */
function renderMain(){
  const main=$('#stageMain');
  if(ST.stage==='proof'){ renderProofMain(main); return; }
  const tp=currentTopic();
  const grid = tp.paper===false ? '' : '';
  main.innerHTML = `
    <div class="card canvas-card">
      <div class="canvas-head">
        <div><h2>${tp.name}</h2><p>${tp.sub}</p></div>
        <span class="badge">${tp.tag}</span>
      </div>
      <div class="svg-wrap">
        <svg id="board" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet">
          <g id="grid-layer"></g><g id="scene"></g>
        </svg>
      </div>
      <div class="toolbar">
        <button class="play-btn" id="btnPlay" title="播放/暂停">
          <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5 L19 12 L8 19 Z" fill="#fff"/></svg>
        </button>
        <button class="ghost-btn" id="btnReplay">重新演示</button>
        <div class="track-wrap">
          <input type="range" class="track" id="track" min="0" max="100" step="1" value="0">
          <span class="time-label" id="timeLabel">0%</span>
        </div>
      </div>
    </div>`;
  $('#grid-layer').innerHTML = tp.paper===false ? '' : paperLayer();
  $('#grid-layer').style.display = tp.paper===false ? 'none' : 'block';
  bindToolbar();
  renderPanel();
  paint();
}

function bindToolbar(){
  const play=$('#btnPlay');
  if(!play) return;
  play.onclick=()=>{
    const tp=currentTopic();
    if(ST.playing){ pause(); }
    else{
      if(ST.t>=1) ST.t=0;
      ST.playing=true;
      lastTs=0;
      rafId=requestAnimationFrame(tick);
      setPlayIcon(true);
    }
  };
  $('#btnReplay').onclick=()=>{ ST.t=0; paint(); ST.playing=true; lastTs=0; rafId=requestAnimationFrame(tick); setPlayIcon(true); };
  $('#track').oninput=(e)=>{
    pause();
    ST.t=(+e.target.value)/100;
    paint();
  };
}

function setPlayIcon(playing){
  const ic=$('#playIcon');
  if(!ic) return;
  ic.innerHTML = playing
    ? '<rect x="7" y="5" width="3.6" height="14" fill="#fff"/><rect x="13.4" y="5" width="3.6" height="14" fill="#fff"/>'
    : '<path d="M8 5 L19 12 L8 19 Z" fill="#fff"/>';
}

function pause(){
  ST.playing=false;
  if(rafId) cancelAnimationFrame(rafId);
  rafId=null;
  setPlayIcon(false);
}

function startPlay(){
  pause();
  ST.t=0;
  ST.playing=true;
  lastTs=0;
  rafId=requestAnimationFrame(tick);
  setPlayIcon(true);
}

function tick(ts){
  if(!ST.playing) return;
  const tp=currentTopic();
  if(!lastTs) lastTs=ts;
  const dt=Math.min(60, ts-lastTs);
  lastTs=ts;
  ST.t = Math.min(1, ST.t + dt/Math.max(600,tp.dur));
  paint();
  if(ST.t>=1){ ST.playing=false; setPlayIcon(false); rafId=null; return; }
  rafId=requestAnimationFrame(tick);
}

/* ---------- 画布绘制 ---------- */
function paint(){
  if(ST.stage==='proof'){ paintProof(); return; }
  const tp=currentTopic();
  const P=paramsOf(tp);
  const scene=$('#scene');
  if(!scene) return;
  scene.innerHTML = tp.render(P, ST.t);
  const track=$('#track');
  if(track){
    const pct=Math.round(ST.t*100);
    track.value=pct;
    $('#timeLabel').textContent=pct+'%';
    track.style.setProperty('--fill', pct+'%');
  }
  updateStepHighlight();
}

/* ---------- 右栏 ---------- */
function renderPanel(){
  const tp=currentTopic();
  const P=paramsOf(tp);
  const data=tp.panel(P, ST.t);
  const panel=$('#sidePanel');
  panel.innerHTML = `
    <div class="panel-block">
      <h3>参数调节</h3>
      <div id="panelParams">${paramsHTML(tp,P)}</div>
    </div>
    <div class="panel-block" id="panelFormula">${formulaHTML(data)}</div>
    <div class="panel-block">
      <h3>讲解</h3>
      <div class="steps" id="panelSteps">${stepsHTML(data)}</div>
      ${data.tip?`<div class="tip">${data.tip}</div>`:''}
    </div>
    <div class="panel-block"><h3>图例</h3><div class="legend">${legendHTML(data)}</div></div>`;
  bindParams(tp);
  lastStep=-1;
  updateStepHighlight();
}

function paramsHTML(tp,P){
  if(!tp.params.length) return `<div class="p-row"><span class="p-name">这一节没有可调参数，直接点播放看过程。</span></div>`;
  return tp.params.map(p=>{
    if(p.type==='select'){
      return `<div class="p-row"><div class="p-top"><span class="p-name">${p.label}</span></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${p.options.map(o=>`<button class="chip" data-sel="${p.k}" data-val="${o[0]}" style="${P[p.k]===o[0]?'border-color:var(--teal);color:var(--teal);font-weight:500':''}">${o[1]}</button>`).join('')}
        </div></div>`;
    }
    const pct = Math.round((P[p.k]-p.min)/((p.max-p.min)||1)*100);
    return `<div class="p-row">
      <div class="p-top"><span class="p-name">${p.label}</span><span class="p-val" id="pv-${p.k}">${P[p.k]}${p.unit||''}</span></div>
      <input type="range" data-param="${p.k}" min="${p.min}" max="${p.max}" step="${p.step}" value="${P[p.k]}" style="--fill:${pct}%">
    </div>`;
  }).join('');
}

function bindParams(tp){
  $$('[data-param]').forEach(inp=>{
    inp.oninput=(e)=>{
      const k=e.target.getAttribute('data-param');
      const v=Number(e.target.value);
      ST.params[tp.id][k]=v;
      const spec=tp.params.filter(x=>x.k===k)[0];
      const lbl=$('#pv-'+k);
      if(lbl) lbl.textContent=v+(spec&&spec.unit?spec.unit:'');
      const pct=Math.round((v-spec.min)/((spec.max-spec.min)||1)*100);
      e.target.style.setProperty('--fill',pct+'%');
      refreshReadout();
    };
  });
  $$('[data-sel]').forEach(b=>{
    b.onclick=()=>{
      const k=b.getAttribute('data-sel');
      ST.params[tp.id][k]=b.getAttribute('data-val');
      $('#panelParams').innerHTML=paramsHTML(tp,paramsOf(tp));
      bindParams(tp);
      refreshReadout();
    };
  });
}

function refreshReadout(){
  const tp=currentTopic();
  const P=paramsOf(tp);
  const d=tp.panel(P,ST.t);
  $('#panelFormula').innerHTML=formulaHTML(d);
  $('#panelSteps').innerHTML=stepsHTML(d);
  const tipEl=$('.tip');
  if(tipEl && d.tip) tipEl.textContent=d.tip;
  lastStep=-1;
  paint();
}

function formulaHTML(d){
  let s = `<h3>关系式</h3><div class="formula">${d.formula}</div>`;
  if(d.calc) s += `<div class="result-line"><span>${d.calc}</span></div>`;
  if(d.value) s += `<div class="result-line"><span>=</span><b>${d.value}</b><span>${d.unit||''}</span></div>`;
  return s;
}
function stepsHTML(d){
  return d.steps.map((s,i)=>`<div class="step" data-step="${i}"><span class="n">${i+1}</span><span>${s.text}</span></div>`).join('');
}
function legendHTML(d){
  if(!d.legend) return '';
  return d.legend.map(l=>`<span class="lg"><i style="background:${l.c}"></i>${l.label}</span>`).join('');
}

function updateStepHighlight(){
  const tp=currentTopic();
  const P=paramsOf(tp);
  const d=tp.panel(P, ST.t);
  let cur=0;
  d.steps.forEach((s,i)=>{ if(ST.t >= (s.at||0)) cur=i; });
  if(cur===lastStep) return;
  lastStep=cur;
  $$('#panelSteps .step').forEach((el,i)=>{
    el.classList.toggle('on', i<=cur);
    el.style.opacity = i<=cur ? 1 : .55;
  });
}

/* ---------- 证明题 ---------- */
function renderProofMain(main){
  main.innerHTML = `
    <div class="card">
      <div class="proof-head">
        <h2>证明题工作台</h2>
        <p>把几何证明题粘贴进来，自动识别题型、画出图形，并给出分步解答。</p>
      </div>
      <div class="proof-body">
        <textarea id="probText" placeholder="例如：在△ABC中，AB=AC，D是BC的中点。求证：AD⊥BC。">${esc(ST.proof.text)}</textarea>
        <div class="proof-actions">
          <button class="primary-btn" id="btnSolve">生成图形与解答</button>
          <button class="chip" id="btnClear">清空</button>
        </div>
        <div class="hint-line">也可直接点左侧题型载入示例。识别依据是题目里的关键词与几何条件。</div>
        <div id="proofMsg"></div>
      </div>
    </div>
    <div class="card canvas-card">
      <div class="canvas-head">
        <div><h2 id="pvTitle">还没有题目</h2><p id="pvSub">粘贴题目后点击"生成图形与解答"</p></div>
        <span class="badge" id="pvBadge">证明题</span>
      </div>
      <div class="svg-wrap">
        <svg id="board" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet">
          <g id="grid-layer"></g><g id="scene"></g>
        </svg>
      </div>
      <div class="toolbar">
        <button class="ghost-btn" id="btnPrev">上一步</button>
        <button class="ghost-btn" id="btnNext">下一步</button>
        <div class="track-wrap"><span class="time-label" id="stepLabel" style="width:auto">第 0 / 0 步</span></div>
      </div>
    </div>`;
  $('#grid-layer').innerHTML = paperLayer();
  $('#btnSolve').onclick=()=>solveProof();
  $('#btnClear').onclick=()=>{
    ST.proof={key:null,step:0,text:''};
    renderProofMain($('#stageMain'));
    renderProofPanel();
  };
  $('#btnPrev').onclick=()=>{ stepProof(-1); };
  $('#btnNext').onclick=()=>{ stepProof(1); };
  const ta=$('#probText');
  ta.oninput=()=>{ ST.proof.text=ta.value; };
  if(ST.proof.key) paintProof();
  else paintEmptyScene();
  renderProofPanel();
}

function paintEmptyScene(){
  const s=$('#scene');
  if(!s) return;
  s.innerHTML = `<g opacity=".55">
    <line x1="300" y1="360" x2="600" y2="360" stroke="${COL.ink3}" stroke-width="1.2"/>
    <line x1="300" y1="360" x2="380" y2="240" stroke="${COL.ink3}" stroke-width="1.2"/>
    <line x1="600" y1="360" x2="380" y2="240" stroke="${COL.ink3}" stroke-width="1.2"/>
    <circle cx="380" cy="240" r="4" fill="${COL.ink3}"/>
    <circle cx="300" cy="360" r="4" fill="${COL.ink3}"/>
    <circle cx="600" cy="360" r="4" fill="${COL.ink3}"/>
  </g>`;
  s.innerHTML += `<text x="450" y="450" text-anchor="middle" font-size="14" fill="${COL.ink3}">等待题目…</text>`;
}

function solveProof(){
  const txt = ST.proof.text.trim();
  const msg=$('#proofMsg');
  if(!txt){
    if(msg) msg.innerHTML = `<div class="err-box">先输入一道几何证明题，或点左侧的题型载入示例。</div>`;
    return;
  }
  const tpl = matchProof(txt);
  if(!tpl){
    ST.proof.key=null; ST.proof.step=0;
    if(msg) msg.innerHTML = `<div class="err-box">没有匹配到可识别的题型。当前引擎按关键词匹配，已收录 ${PROOFS.length} 类经典证明题。请确认题目中是否出现"等腰""中点""平行四边形""切线""圆周角""相似"等关键条件，或直接点左侧题型查看示例。</div>`;
    $('#pvTitle').textContent='未识别';
    $('#pvSub').textContent='换一种表述，或直接从左侧选择一个题型。';
    paintEmptyScene();
    renderProofPanel();
    return;
  }
  ST.proof.key = tpl.id;
  ST.proof.step = 0;
  const built = tpl.build();
  ST.proof.steps = built.steps;
  ST.proof.svg = built.svg;
  if(msg) msg.innerHTML = `<div class="hint-line">已识别：<b style="color:var(--teal)">${tpl.name}</b></div>`;
  $('#pvTitle').textContent = tpl.name;
  $('#pvSub').textContent = '图形下方的每一步都对应图中的高亮，可逐步查看。';
  $('#pvBadge').textContent = '已识别';
  paintProof();
  renderProofPanel();
}

function paintProof(){
  if(!ST.proof.svg) { paintEmptyScene(); return; }
  const s=$('#scene');
  if(!s) return;
  const steps=ST.proof.steps||[];
  const cur=steps[ST.proof.step]||steps[0];
  const focus = cur ? cur.f : '';
  const box=ST.proof.svg(focus);
  s.innerHTML = box;
  const lbl=$('#stepLabel');
  if(lbl) lbl.textContent = `第 ${ST.proof.step+1} / ${steps.length} 步`;
}

function stepProof(d){
  const steps=ST.proof.steps||[];
  if(!steps.length) return;
  ST.proof.step = clamp(ST.proof.step+d, 0, steps.length-1);
  paintProof();
  renderProofPanel();
}

function renderProofPanel(){
  const panel=$('#sidePanel');
  const steps=ST.proof.steps||[];
  if(!steps.length){
    panel.innerHTML = `
      <div class="panel-block"><h3>怎么用</h3>
        <div class="steps">
          <div class="step on"><span class="n">1</span><span>把题目原文粘进输入框，条件越完整越容易识别。</span></div>
          <div class="step on"><span class="n">2</span><span>点击"生成图形与解答"，图中会自动标出已知条件。</span></div>
          <div class="step on"><span class="n">3</span><span>用"上一步/下一步"跟着解答走，图会同步高亮。</span></div>
        </div>
        <div class="tip">这个引擎是基于关键词与几何条件的规则匹配，覆盖初中常见证明题型，不会凭空编造解答。遇到不支持的题目，它会明确告诉你，而不是硬套。</div>
      </div>`;
    return;
  }
  panel.innerHTML = `
    <div class="panel-block">
      <h3>解答过程</h3>
      <div class="steps">${steps.map((s,i)=>`<div class="step ${i<=ST.proof.step?'on':''}" data-pstep="${i}" style="cursor:pointer;opacity:${i<=ST.proof.step?1:.5}"><span class="n">${i+1}</span><span><b style="font-weight:600;color:var(--ink)">${s.t}</b><br>${s.b}</span></div>`).join('')}</div>
    </div>
    <div class="panel-block">
      <h3>操作</h3>
      <div class="step-nav">
        <button class="ghost-btn" id="btnPrev2">上一步</button>
        <button class="ghost-btn" id="btnNext2">下一步</button>
      </div>
    </div>`;
  $$('[data-pstep]').forEach(el=>{
    el.onclick=()=>{ ST.proof.step=+el.getAttribute('data-pstep'); paintProof(); renderProofPanel(); };
  });
  $('#btnPrev2').onclick=()=>stepProof(-1);
  $('#btnNext2').onclick=()=>stepProof(1);
}

/* ---------- 学段切换 ---------- */
function switchStage(stage){
  pause();
  ST.stage=stage;
  $$('#stageSwitch button').forEach(b=>b.setAttribute('aria-selected', String(b.getAttribute('data-stage')===stage)));
  if(stage!=='proof'){
    const arr = stage==='primary'?PRIMARY:MIDDLE;
    if(!arr.filter(t=>t.id===ST.id)[0]) ST.id=arr[0].id;
    ST.t=0;
  }
  renderRail();
  renderMain();
  if(stage!=='proof') renderPanel(), startPlay();
  else renderProofPanel();
}

$$('#stageSwitch button').forEach(b=>{
  b.onclick=()=>switchStage(b.getAttribute('data-stage'));
});

renderRail();
renderMain();
renderPanel();
startPlay();

window.addEventListener('load',()=>{ setTimeout(paint,60); });

</script>
</body>
</html>
